name: aml-memory

services:
  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    container_name: aml-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: aml-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: amlpass
      POSTGRES_DB: agent_memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml -d agent_memory"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aml-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_URL=postgresql+psycopg2://aml:amlpass@postgres:5432/agent_memory
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  qdrant_storage:
  postgres_data:
